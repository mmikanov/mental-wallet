name = "mental-wallet-analytics"
main = "src/index.ts"
compatibility_date = "2025-07-01"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "analytics-db"
database_id = "8996f51a-c715-4007-b470-c711678f741d"

# Environment variables (set via `wrangler secret put`)
# DASHBOARD_SECRET — required to access GET /dashboard and GET /events

# Launch phase milestone dates (ISO 8601 format, UTC)
# Update these as you hit each milestone. Dashboard uses them to filter data by phase.
[vars]
MILESTONE_RELEASE = "2026-09-02"
MILESTONE_WARM_END = "2026-09-03T19:00:00Z"
# Cold acquisition begins exactly when warm launch ends (contiguous, no gap/overlap)
MILESTONE_COLD_START = "2026-09-03T19:00:00Z"
EXCLUDED_USER_IDS = ""
