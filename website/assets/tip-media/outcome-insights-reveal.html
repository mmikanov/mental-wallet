<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>outcome-capture Insights reveal — POC</title>
<style>
  /* Staggered reveal of the real Insights screen: sliced into contiguous full-width strips
     (base → Best Tools row 1 → row 2 → Outcome Trends) that reassemble pixel-perfect, then
     each lower strip fades/slides in one after another, then holds. Cycle ~6.5s.
     Web-only CSS; email/feed use a GIF derived via tools/capture-tip-gif.js. */
  :root { --color-bg:#f5f2eb; --color-border:#e0ddd6; --color-text-muted:#6b6b6b; }
  body { font-family:-apple-system,system-ui,sans-serif; background:var(--color-bg); margin:0; padding:40px 16px; display:flex; flex-direction:column; align-items:center; gap:20px; }
  h1 { font-size:1.2rem; } .note { color:var(--color-text-muted); max-width:34rem; text-align:center; font-size:.95rem; }

  /* ============ SHIPPABLE PIECE START ============ */
  .oc-reveal {
    width: 294px;
    margin: 1.5rem auto;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(45,45,45,0.14);
    background: #fff;
    /* stack strips with no gaps */
    display: flex; flex-direction: column;
  }
  .oc-reveal img { display:block; width:100%; height:auto; }
  /* Base strip (header + Best Tools title) always visible */
  .oc-reveal__base { }
  /* Revealed strips start hidden + nudged up, then animate in, in sequence, and STAY. */
  .oc-reveal__row1, .oc-reveal__row2, .oc-reveal__rest { opacity:0; }
  .oc-reveal__row1 { animation: ocIn 0.5s ease-out 0.8s forwards; }
  .oc-reveal__row2 { animation: ocIn 0.5s ease-out 1.7s forwards; }
  .oc-reveal__rest { animation: ocIn 0.6s ease-out 2.8s forwards; }
  @keyframes ocIn {
    0%   { opacity:0; transform: translateY(-10px); }
    100% { opacity:1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .oc-reveal__row1, .oc-reveal__row2, .oc-reveal__rest { opacity:1 !important; animation:none !important; transform:none !important; }
  }
  /* ============ SHIPPABLE PIECE END ============ */

  .controls { display:flex; gap:8px; }
  button { font:inherit; padding:8px 14px; border-radius:8px; border:1px solid var(--color-border); background:#fff; cursor:pointer; }
</style>
</head>
<body>
  <h1>outcome-capture — Insights staggered reveal (POC)</h1>
  <p class="note">Best Tools row 1 → row 2 → Outcome Trends appear one after another, from the
  real Insights screenshot sliced into strips. Holds at the end.</p>

  <figure class="oc-reveal" role="img" aria-label="The Insights screen revealing your best tools one by one, then the outcome trends chart.">
    <img class="oc-reveal__base" src="oc-sliceA.png" alt="">
    <img class="oc-reveal__row1" src="oc-sliceB.png" alt="">
    <img class="oc-reveal__row2" src="oc-sliceC.png" alt="">
    <img class="oc-reveal__rest" src="oc-sliceD.png" alt="">
  </figure>

  <div class="controls"><button onclick="location.reload()">Replay</button></div>
</body>
</html>
