<!DOCTYPE html>
<!-- Dev preview only (gitignored from deploy via assets/tip-media/*.html). Shows the
     emotion-based-session GIF at candidate display widths, in both a plain view and the
     real email layout, so we can judge size/speed before wiring it into the tip. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>emotion-based-session — GIF preview</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background:#e9e9ec; color:#1a1a1a; margin:0; padding:24px 16px; }
  .wrap { max-width: 720px; margin: 0 auto; display:flex; flex-direction:column; gap:24px; }
  .panel { background:#fff; border:1px solid #ddd; border-radius:12px; padding:20px; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  .sizes { display:flex; gap:28px; align-items:flex-start; flex-wrap:wrap; }
  .sizes figure { margin:0; text-align:center; }
  .sizes figcaption { font-size:12px; color:#666; margin-top:6px; }
  img.gif { display:block; border-radius:14px; box-shadow:0 4px 14px rgba(0,0,0,0.12); }
  /* Email layout (mirrors messaging-worker) */
  .email { max-width: 36rem; margin: 0 auto; line-height:1.5; }
  .email img { display:block; border-radius:8px; margin:0 auto 1rem; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h2>Candidate display widths (same file, different rendered size)</h2>
      <div class="sizes">
        <figure><img class="gif" src="emotion-based-session.gif" width="200"><figcaption>200px</figcaption></figure>
        <figure><img class="gif" src="emotion-based-session.gif" width="240"><figcaption>240px (proposed)</figcaption></figure>
        <figure><img class="gif" src="emotion-based-session.gif" width="300"><figcaption>300px (natural)</figcaption></figure>
      </div>
    </div>

    <div class="panel">
      <h2>In the email layout (at 240px, centered)</h2>
      <div class="email">
        <p>Hi there,</p>
        <img src="emotion-based-session.gif" width="240" alt="Tapping Start from how I feel, choosing an emotion, and getting suggested tools.">
        <h3 style="font-size:1.2rem;margin:0 0 .5rem">Not sure what you need? Start from how you feel</h3>
        <p>Instead of hunting for the right tool, pick your emotion and let the app suggest what fits.</p>
        <p style="margin:1.5rem 0"><a href="#" style="display:inline-block;background:#4f46e5;color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px">Try Start from how I feel</a></p>
      </div>
    </div>
  </div>
</body>
</html>
